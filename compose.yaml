services:
  smelp:
    build: .
    restart: unless-stopped
    ports:
      - "${SMELP_PORT:-3000}:3000"
    # Optional settings. Copy .env.example to .env to change any of them.
    env_file:
      - path: .env
        required: false
    volumes:
      # All of smelp's data, including photos, is one SQLite database in here.
      - smelp-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  smelp-data:
