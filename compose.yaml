services:
  smelp:
    # `docker compose pull` gets the published image, and `--build` builds from source.
    image: ghcr.io/jph-sw/smelp:${SMELP_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${SMELP_PORT:-3000}:3000"
    # Optional settings. Copy .env.example to .env to change any of them.
    env_file:
      - path: .env
        required: false
    volumes:
      # All of smelp's data is in here: the SQLite database, which includes photos, and
      # the attachments folder. Nothing else is written, so the rest can stay read-only.
      - smelp-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  smelp-data:
